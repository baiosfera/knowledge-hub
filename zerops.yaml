zerops:
  - setup: knowledge
    build:
      base: ubuntu/python@3.12
      buildCommands:
        - pip install --target=./vendor -r requirements.txt
      deployFiles:
        - .
      cache:
        - vendor

    deploy:
      readinessCheck:
        httpGet:
          port: 8000
          path: /health

    run:
      base: ubuntu/python@3.12
      ports:
        - port: 8000
          httpSupport: true
      envVariables:
        PYTHONPATH: /var/www/vendor
        QDRANT_HOST: qdrant
        QDRANT_PORT: ${qdrant_port}
        QDRANT_GRPC_PORT: ${qdrant_grpcPort}
        QDRANT_API_KEY: ${qdrant_apiKey}
        FASTEMBED_CACHE_PATH: /tmp/fastembed_cache
        PYTHONUNBUFFERED: "1"
      start: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
